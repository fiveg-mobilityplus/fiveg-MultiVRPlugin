<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">單台頭盔首次定位</title>
  <desc id="desc">先在編輯器設定 Start System 與事件，再打包到頭盔驗證首次定位。</desc>
  <style>text{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;font-size:20px;fill:#e3e8ee}.title{font-size:23px;font-weight:700}.heading{font-size:25px;font-weight:700;fill:#f4f8fc}.node{fill:#202c39;stroke:#81909f;stroke-width:2}.game{fill:#d9edff;stroke:#70b7fa;stroke-width:2}.dark{fill:#10243b}.group{fill:#172537;stroke:#455a72;stroke-width:1.5}.wire{fill:none;stroke:#a9c2d8;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9c2d8"/></marker></defs>
  <rect width="1000" height="620" rx="14" fill="#101b2a"/>
  <rect class="group" x="20" y="20" width="416" height="578" rx="10"/>
  <rect class="group" x="564" y="20" width="416" height="578" rx="10"/>
  <text x="228" y="61" text-anchor="middle" class="heading">在 UE 編輯器設定</text>
  <text x="772" y="61" text-anchor="middle" class="heading">在頭盔上執行</text>
  <g class="step">
  <rect class="node" x="42" y="90" width="372" height="76" rx="10"/>
  <text x="228" y="122" text-anchor="middle" class="title">在玩家 Pawn 加入</text>
  <text x="228" y="148" text-anchor="middle" class="">MultiVR Component</text>
  </g>
  <g class="step">
  <rect class="node" x="42" y="200" width="372" height="76" rx="10"/>
  <text x="228" y="232" text-anchor="middle" class="title">設定 Start System</text>
  <text x="228" y="258" text-anchor="middle" class="">Target 與輸入腳位</text>
  </g>
  <path class="wire" d="M228 168V196"/>
  <g class="step">
  <rect class="node" x="42" y="310" width="372" height="76" rx="10"/>
  <text x="228" y="342" text-anchor="middle" class="title">接好事件與執行線</text>
  <text x="228" y="368" text-anchor="middle" class="">Compile、Save</text>
  </g>
  <path class="wire" d="M228 278V306"/>
  <g class="step">
  <rect class="node" x="580" y="86" width="384" height="62" rx="10"/>
  <text x="772" y="124" text-anchor="middle" class="title">Pawn · Event BeginPlay</text>
  </g>
  <g class="step">
  <rect class="node" x="580" y="170" width="384" height="62" rx="10"/>
  <text x="772" y="208" text-anchor="middle" class="title">綁定 OnSystemReady 等事件</text>
  </g>
  <path class="wire" d="M772 150V166"/>
  <g class="step">
  <rect class="game" x="580" y="254" width="384" height="62" rx="10"/>
  <text x="772" y="279" text-anchor="middle" class="dark title">執行 Start System</text>
  <text x="772" y="305" text-anchor="middle" class="dark ">帶入後台、房間與地圖參數</text>
  </g>
  <path class="wire" d="M772 234V250"/>
  <g class="step">
  <rect class="node" x="580" y="338" width="384" height="62" rx="10"/>
  <text x="772" y="376" text-anchor="middle" class="title">下載標定與地圖，啟動相機</text>
  </g>
  <path class="wire" d="M772 318V334"/>
  <g class="step">
  <rect class="node" x="580" y="422" width="384" height="62" rx="10"/>
  <text x="772" y="460" text-anchor="middle" class="title">玩家正對牆面 marker 站穩</text>
  </g>
  <path class="wire" d="M772 402V418"/>
  <g class="step">
  <rect class="game" x="580" y="506" width="384" height="62" rx="10"/>
  <text x="772" y="531" text-anchor="middle" class="dark title">OnSystemReady</text>
  <text x="772" y="557" text-anchor="middle" class="dark ">顯示定位完成</text>
  </g>
  <path class="wire" d="M772 486V502"/>
  <path class="wire" d="M228 389V431"/>
  <g class="step">
    <rect class="node" x="42" y="435" width="372" height="76" rx="10"/>
    <text x="228" y="480" text-anchor="middle" class="title">打包、安裝並啟動 APK</text>
  </g>
  <path class="wire" d="M416 473H500V117H577"/>
</svg>
