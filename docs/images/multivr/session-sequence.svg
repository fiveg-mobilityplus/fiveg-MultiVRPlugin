<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="938" viewBox="0 0 1000 938" role="img" aria-labelledby="title desc">
  <title id="title">一場遊戲的開場與結束</title>
  <desc id="desc">從建立房間、派發 APK、連線與首次定位，到結束遊戲並回到待機。</desc>
  <style>text{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;font-size:20px;fill:#e3e8ee}.title{font-size:23px;font-weight:700}.heading{font-size:25px;font-weight:700;fill:#f4f8fc}.node{fill:#202c39;stroke:#81909f;stroke-width:2}.game{fill:#d9edff;stroke:#ef4444;stroke-width:3}.dark{fill:#10243b}.group{fill:#172537;stroke:#455a72;stroke-width:1.5}.wire{fill:none;stroke:#a9c2d8;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9c2d8"/></marker></defs>
  <rect width="1000" height="938" rx="14" fill="#101b2a"/>
  <g class="step">
  <rect class="node" x="420" y="22" width="130" height="66" rx="10"/>
  <text x="485" y="62" text-anchor="middle" class="title">場館後台</text>
  </g>
  <path d="M485 90V914" fill="none" stroke="#81909f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <g class="step">
  <rect class="game" x="569" y="22" width="130" height="66" rx="10"/>
  <text x="634" y="49" text-anchor="middle" class="dark title">Content</text>
  <text x="634" y="75" text-anchor="middle" class="dark ">Server</text>
  </g>
  <path d="M634 90V914" fill="none" stroke="#81909f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <g class="step">
  <rect class="node" x="718" y="22" width="130" height="66" rx="10"/>
  <text x="783" y="62" text-anchor="middle" class="title">Lobby</text>
  </g>
  <path d="M783 90V914" fill="none" stroke="#81909f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <g class="step">
  <rect class="game" x="867" y="22" width="130" height="66" rx="10"/>
  <text x="932" y="49" text-anchor="middle" class="dark title">Content</text>
  <text x="932" y="75" text-anchor="middle" class="dark">APK</text>
  </g>
  <path d="M932 90V914" fill="none" stroke="#81909f" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="28" y="65" text-anchor="start" class="heading">事件順序</text>
  <text x="30" y="137" text-anchor="start" class="">1</text>
  <text x="70" y="124.5" text-anchor="start" class="">工作人員建立房間，</text>
  <text x="70" y="149.5" text-anchor="start" class="">啟動遊戲伺服器</text>
  <path class="wire" d="M485 130H634"/>
  <path d="M20 167H978" stroke="#29394a"/>
  <text x="30" y="206" text-anchor="start" class="">2</text>
  <text x="70" y="206" text-anchor="start" class="">登記遊戲位址與房間</text>
  <path class="wire" d="M634 199H485"/>
  <path d="M20 236H978" stroke="#29394a"/>
  <text x="30" y="275" text-anchor="start" class="">3</text>
  <text x="70" y="275" text-anchor="start" class="">指定 APK、伺服器、房間與地圖</text>
  <path class="wire" d="M485 268H783"/>
  <path d="M20 305H978" stroke="#29394a"/>
  <text x="30" y="344" text-anchor="start" class="">4</text>
  <text x="70" y="331.5" text-anchor="start" class="">中斷 Lobby 後台連線，</text>
  <text x="70" y="356.5" text-anchor="start" class="">啟動 APK 並傳入參數</text>
  <path class="wire" d="M783 337H932"/>
  <path d="M20 374H978" stroke="#29394a"/>
  <text x="30" y="413" text-anchor="start" class="">5</text>
  <text x="70" y="413" text-anchor="start" class="">open 加入 UE 多人遊戲</text>
  <path class="wire" d="M932 406H634"/>
  <path d="M20 443H978" stroke="#29394a"/>
  <text x="30" y="482" text-anchor="start" class="">6</text>
  <text x="70" y="482" text-anchor="start" class="">StartSystem 連線並索取標定與地圖</text>
  <path class="wire" d="M932 475H485"/>
  <path d="M20 512H978" stroke="#29394a"/>
  <text x="30" y="551" text-anchor="start" class="">7</text>
  <text x="70" y="551" text-anchor="start" class="">回傳標定與場地地圖</text>
  <path class="wire" d="M485 544H932" stroke-dasharray="6 5"/>
  <path d="M20 581H978" stroke="#29394a"/>
  <text x="30" y="620" text-anchor="start" class="">8</text>
  <text x="70" y="620" text-anchor="start" class="">相機看見 marker，首次定位完成</text>
  <path class="wire" d="M932 604h30v18h-30"/>
  <path d="M20 650H978" stroke="#29394a"/>
  <text x="30" y="689" text-anchor="start" class="">9</text>
  <text x="70" y="689" text-anchor="start" class="">工作人員開始或暫停遊戲</text>
  <path class="wire" d="M485 682H634"/>
  <path d="M20 719H978" stroke="#29394a"/>
  <text x="30" y="758" text-anchor="start" class="">10</text>
  <text x="70" y="758" text-anchor="start" class="">工作人員結束遊戲</text>
  <path class="wire" d="M485 751H932"/>
  <path d="M20 788H978" stroke="#29394a"/>
  <text x="30" y="827" text-anchor="start" class="">11</text>
  <text x="70" y="814.5" text-anchor="start" class="">收到 WSMessage_CloseGame，</text>
  <text x="70" y="839.5" text-anchor="start" class="">執行 Quit Game</text>
  <path class="wire" d="M932 811h30v18h-30"/>
  <path d="M20 857H978" stroke="#29394a"/>
  <text x="30" y="896" text-anchor="start" class="">12</text>
  <text x="70" y="896" text-anchor="start" class="">回到待機畫面，重新連線</text>
  <path class="wire" d="M783 889H485"/>
</svg>
