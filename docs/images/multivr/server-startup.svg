<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" role="img" aria-labelledby="title desc">
  <title id="title">Content Server 的 GameMode</title>
  <desc id="desc">Dedicated Server 綁定事件、登記到後台，並回報遊戲進度與狀態。</desc>
  <style>text{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;font-size:20px;fill:#e3e8ee}.title{font-size:23px;font-weight:700}.heading{font-size:25px;font-weight:700;fill:#f4f8fc}.node{fill:#202c39;stroke:#81909f;stroke-width:2}.game{fill:#d9edff;stroke:#70b7fa;stroke-width:2}.dark{fill:#10243b}.group{fill:#172537;stroke:#455a72;stroke-width:1.5}.wire{fill:none;stroke:#a9c2d8;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9c2d8"/></marker></defs>
  <rect width="900" height="528" rx="14" fill="#101b2a"/>
  <g class="step">
  <rect class="game" x="32" y="20" width="612" height="70" rx="10"/>
  <text x="338" y="62" text-anchor="middle" class="dark title">GameMode · Event BeginPlay</text>
  </g>
  <g class="step">
  <rect class="node" x="32" y="113" width="612" height="70" rx="10"/>
  <text x="338" y="155" text-anchor="middle" class="title">Is Dedicated Server？</text>
  </g>
  <path class="wire" d="M335 92V109"/>
  <g class="step">
  <rect class="node" x="32" y="223" width="612" height="70" rx="10"/>
  <text x="338" y="252" text-anchor="middle" class="title">綁定開始與暫停事件</text>
  <text x="338" y="278" text-anchor="middle" class="">OnWebAction_StartGame／OnWebAction_PauseGame</text>
  </g>
  <path class="wire" d="M335 185V219"/>
  <g class="step">
  <rect class="game" x="32" y="329" width="612" height="70" rx="10"/>
  <text x="338" y="358" text-anchor="middle" class="dark title">StartConnectWebSocket</text>
  <text x="338" y="384" text-anchor="middle" class="dark ">登記到場館後台</text>
  </g>
  <path class="wire" d="M335 295V325"/>
  <g class="step">
  <rect class="node" x="32" y="435" width="612" height="70" rx="10"/>
  <text x="338" y="477" text-anchor="middle" class="title">遊戲載入與狀態變動時回報進度、狀態</text>
  </g>
  <path class="wire" d="M335 401V431"/>
  <text x="364" y="212" text-anchor="middle" class="">是</text>
  <g class="step">
  <rect class="node" x="697" y="223" width="177" height="70" rx="10"/>
  <text x="785.5" y="265" text-anchor="middle" class="title">結束此分支</text>
  </g>
  <path class="wire" d="M647 148H786V219"/>
  <text x="718" y="138" text-anchor="middle" class="">否</text>
</svg>
